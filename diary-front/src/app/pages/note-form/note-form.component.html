<section class="form-page">

<div class="form-card">

  <h2>
    ✨ Nouvelle pensée
  </h2>

  <input
    placeholder="Titre de la note 🌸"
    [(ngModel)]="note.titre"
  >

  <textarea
    rows="8"
    placeholder="Écris ce que tu ressens 💭"
    [(ngModel)]="note.texte"
  ></textarea>

  <button
    (click)="createNote()"
  >
    💾 Enregistrer
  </button>

</div>

</section>
